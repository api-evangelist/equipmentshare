aid: equipmentshare
name: EquipmentShare
description: >-
  EquipmentShare is a construction technology and equipment-solutions company (founded 2015,
  headquartered in Columbia, Missouri) whose proprietary platform, T3, unifies telematics,
  rental and fleet operations across one of the largest mixed fleets in the US — 349,000+
  connected assets across 380+ locations. Its developer surface, T3OS, exposes a GraphQL ERP
  API (es-erp-api) at api.equipmentshare.com with three first-party auth flows backed by Auth0:
  user-delegated OAuth 2.0 (Authorization Code + PKCE), workspace-installed API keys
  (X-API-Key), and sign-in-only OpenID Connect. T3 also offers an Outbound Developer API for
  structured fleet-data access (XML/JSON) and aggregates AEMP-compliant OEM telematics. Access
  is granted through the T3OS developer portal (app.t3os.ai) and app registration.
